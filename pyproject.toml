[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-review"
version = "0.2.0"
description = "NCS 학습모듈 F02 검수 엔진 — 차례·개요·필요지식·위치 규칙 검사 (hwp/hwpx)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []  # 표준 라이브러리만 사용

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ncs-review = "ncs_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
